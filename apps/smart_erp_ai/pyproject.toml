[project]
name = "smart_erp_ai"
authors = [
    { name = "Tim Smart ERP" }
]
description = "Agentic Process Intelligence di atas ERP open source (L2)."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = ["langchain>=0.3,<0.4", "langchain-openai>=0.2,<0.3"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B904"]
